      - id: e2e-tests
        title: "End-to-end corpus browser tests"
        description: "Vitest suites for new API + UI components."
        tasks:
          - "Test corpus catalog pagination + search"
          - "Test corpus detail R2 fallback (missing → 404)"
          - "Test vectorize search cost guard (topK=10 max)"
          - "Test UI rendering with mock data"
        dependencies: [ui-corpus-browser, ui-reading-viewer, ui-vectorize-search]
        worktree: true
        constraints:
          - "Red → green → refactor"
          - "No weakening of existing assertions"
        worker_bootstrap_packet:
          - "git checkout -b feature/e2e-corpus-tests"
          - "npm ci"
        owner: te-validate
        assignee: "orchestrator"
        issues:
          - title: "Add E2E tests for corpus browser flow"
            template: test

  - name: "Integration + Release"
    phase: release
    description: "Merge all worktree branches, run CI, verify live on staging, create PR."
    exit_criteria:
      - "All branches merged into codex/r2-vectorize-corpus-ui"
      - "CI gate: npm run verify:all passes (305+ existing + new tests)"
      - "PR created with evidence"
    swarms:
      - id: merge-and-ci
        title: "Integrate all branches + CI gate"
        description: "Merge worktrees and run full verification."
        tasks:
          - "Merge all feature branches into codex/r2-vectorize-corpus-ui"
          - "Run: npm test (vitest) + npm run test:cf (function tests)"
          - "Run: npm run verify:all (daily contracts + taxonomy + edge checks)"
          - "Create PR to main with evidence"
        dependencies: [auth-corpus-routes, e2e-tests]
        worktree: false
        constraints:
          - "All CI must pass (exit 0)"
          - "No unrelated dirty files in commit"
        worker_bootstrap_packet:
          - "git checkout codex/r2-vectorize-corpus-ui"
          - "npm ci"
        owner: te-validate
        assignee: "orchestrator"
        issues:
          - title: "Integrate R2/Vectorize corpus UI — PR"
            template: feature

acceptance:
  - "ISC-333: GET /api/corpus/:id returns R2 HTML body — verified via curl with test SHA-256"
  - "ISC-334: GET /api/patterns/search returns Vectorize results — verified via curl with test query"
  - "ISC-#133: Corpus browser UI shows reading list — verified via browser screenshot"
  - "ISC-#137: Corpus browser renders R2 body in XSS-safe iframe — verified via DOMPurify test"
  - "ISC-#132: Pattern memory store queryable via /api/patterns/search — verified via curl"
  - "ISC-#139: 723 readings with full provenance + R2 body — verified: R2 object count == 723, D1 count == 723"
  - "T-008: All new routes fail-closed without CF Access JWT — verified via negative tests"
  - "Vitest suite passes: npm test + npm run test:cf (305 existing + N new, 0 failures)"
  - "CI gate: npm run verify:all passes on merged branch"

risk_register:
  - risk: "R2 bucket / Vectorize index don't exist yet on Cloudflare"
    mitigation: "provision-cf-resources wave creates them before bindings are added"
    owner: provision-cf-resources
    status: "discovered"
  - risk: "D1 catalogue_readings table doesn't exist yet"
    mitigation: "d1-catalogue-migration wave creates migration 0009 before API routes"
    owner: d1-catalogue-migration
    status: "discovered"
  - risk: "723 corpus HTML files may not be locally accessible for ingestion"
    mitigation: "ingest-corpus-r2 task checks local filesystem first; may need archive from Selemene Engine"
    owner: ingest-corpus-r2
    status: "open"
  - risk: "Vectorize query cost exceeds budget"
    mitigation: "api-vectorize-search hard-caps topK at 10; client debounces 500ms"
    owner: api-vectorize-search
    status: "mitigated"
  - risk: "HTML rendering XSS vulnerability"
    mitigation: "ui-reading-viewer uses DOMPurify + iframe sandbox"
    owner: ui-reading-viewer
    status: "mitigated"
  - risk: "Auth bypass on new routes"
    mitigation: "auth-corpus-routes wave runs all 3 routes through negative-path suite"
    owner: auth-corpus-routes
    status: "mitigated"

assumptions:
  - "Admin user sheshnirayan.iyer@gmail.com is the sole corpus owner"
  - "723 corpus HTML renders exist in an external PostgreSQL archive and need R2 sync"
  - "Cloudflare Workers AI @cf/baai/bge-small-en-v1.5 is accessible for embedding generation"
  - "All corpus data is owner-scoped and consent-gated per ISA #139"

constraints:
  - "No Sol-family models in any worker dispatch"
  - "All new code must pass existing 305/305 test suite"
  - "wrangler.toml must not expose secrets"
  - "Corpus routes must fail-closed per T-008"
  - "Maximum 4 concurrent worker processes (per temperance dispatch rule)"
  - "R2 key pattern: corpus/readings/{sha256}/reading.html"
  - "Vectorize index: 1536 dims, cosine metric, topK=10 max"
