          - "Must pass functions/__tests__/auth-negative.test.ts suite"
        worker_bootstrap_packet:
          - "git checkout -b feature/auth-corpus-routes"
          - "npm ci"
          - "npm run test:cf"
        owner: te-validate
        assignee: "orchestrator"
        issues:
