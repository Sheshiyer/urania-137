        worker_bootstrap_packet:
          - "git checkout -b feature/ui-vectorize-search"
          - "npm ci"
        owner: te-build
        assignee: "orchestrator"
        issues:
          - title: "Build Vectorize pattern search UI"
            template: feature

  - name: "Auth Scoping + Tests"
    phase: hardening
    description: "Ensure all new routes respect T-008 fail-closed auth, add negative-path tests."
    exit_criteria:
      - "All three API routes return 401 without valid CF Access JWT"
      - "Dev-identity injection works only in dev, never in prod"
      - "Existing 305 tests still pass"
    swarms:
      - id: auth-corpus-routes
        title: "Scope corpus routes to authenticated owner"
        description: "Verify auth middleware coverage on all new routes."
        tasks:
          - "Add negative test: GET /api/corpus without token → 401"
          - "Add negative test: GET /api/corpus/:id without token → 401"
          - "Add negative test: GET /api/patterns/search without token → 401"
          - "Verify DEV_IDENTITY_EMAIL works in dev, fails in prod for these routes"
