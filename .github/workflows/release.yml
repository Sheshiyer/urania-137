name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit to release
        required: true
        type: string
      version:
        description: Exact version already committed in package.json
        required: true
        type: string
      readiness_run_id:
        description: Workflow run containing same-SHA readiness receipt and preview proofs
        required: true
        type: string

concurrency:
  group: urania-production-release
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  checks: read
  contents: write
  id-token: write

jobs:
  release:
    name: Immutable production release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_SMOKE_CLIENT_ID: ${{ secrets.CF_ACCESS_SMOKE_CLIENT_ID }}
      CF_ACCESS_SMOKE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_SMOKE_CLIENT_SECRET }}
      ALERT_PROBE_TOKEN: ${{ secrets.ALERT_PROBE_TOKEN }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$READINESS_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Download same-SHA readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-input
          gh run download "$READINESS_RUN_ID" \
            --name "urania-readiness-$RELEASE_SHA" \
            --dir .release-input
          test -f .release-input/backup-receipt.json
          test -f .release-input/preview-proofs.json
          test -f .release-input/production-targets.json
          test -f .release-input/location-remediation-manifest.json
          test -f .release-input/governance-snapshot.json
          test "$(node -p 'const p=JSON.parse(require("fs").readFileSync(".release-input/preview-proofs.json")); p.subjectSha === process.env.RELEASE_SHA && p.ok === true')" = "true"
          test "$(node -p 'const p=JSON.parse(require("fs").readFileSync(".release-input/location-remediation-manifest.json")); p.subjectSha === process.env.RELEASE_SHA')" = "true"
          mkdir -p .release

      - name: Install dependencies
        run: npm ci

      - name: Exact-SHA release preflight
        run: >-
          node scripts/verify/release-preflight.mjs
          --mode actions
          --sha "$RELEASE_SHA"
          --version "$RELEASE_VERSION"
          --receipt .release-input/backup-receipt.json

      - name: Canonical production gate
        run: npm run verify:ci

      - name: Build immutable artifacts
        run: npm run build

      - name: Revalidate production targets
        run: >-
          node scripts/ops/validate-targets.mjs
          --targets .release-input/production-targets.json

      - name: Fresh production backup and restore receipt
        run: >-
          node scripts/d1/backup.mjs
          --production
          --targets .release-input/production-targets.json
          --output .release/fresh-backup-receipt.json

      - name: Apply production migrations
        run: >-
          node scripts/ops/cutover.mjs d1-migrate
          --targets .release-input/production-targets.json
          --backup .release/fresh-backup-receipt.json
          --apply
          --confirm "$(node -p 'JSON.parse(require("fs").readFileSync(".release-input/production-targets.json")).productionD1Id')"
          --receipt .release/d1-migrate.json

      - name: Apply reviewed location remediation manifest
        run: >-
          node scripts/data/mark-subjects-for-review.mjs
          --remote
          --manifest .release-input/location-remediation-manifest.json
          --backup .release/fresh-backup-receipt.json
          --apply

      - name: Deploy protected application
        run: >-
          node scripts/ops/cutover.mjs app-deploy
          --targets .release-input/production-targets.json
          --artifact dist/app
          --sha "$RELEASE_SHA"
          --apply
          --confirm "$(node -p 'JSON.parse(require("fs").readFileSync(".release-input/production-targets.json")).protectedPagesProjectId')"
          --receipt .release/app-deploy.json

      - name: Deploy public landing
        run: >-
          node scripts/ops/cutover.mjs landing-deploy
          --targets .release-input/production-targets.json
          --artifact dist/landing
          --sha "$RELEASE_SHA"
          --apply
          --confirm "$(node -p 'JSON.parse(require("fs").readFileSync(".release-input/production-targets.json")).publicPagesProjectId')"
          --receipt .release/landing-deploy.json

      - name: Production read-only smoke and alert delivery
        run: |
          set -euo pipefail
          node scripts/verify/split-host-gates.mjs \
            --targets .release-input/production-targets.json \
            --smoke-client-id "$CF_ACCESS_SMOKE_CLIENT_ID" \
            --smoke-client-secret "$CF_ACCESS_SMOKE_CLIENT_SECRET" \
            --deny-mutations
          node scripts/ops/alert-probe.mjs \
            --targets .release-input/production-targets.json \
            --token "$ALERT_PROBE_TOKEN" \
            --expect-delivery

      - name: Assemble attestation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          export APP_SHA256="$(tar -cf - dist/app | sha256sum | cut -d' ' -f1)"
          export LANDING_SHA256="$(tar -cf - dist/landing | sha256sum | cut -d' ' -f1)"
          export BACKUP_SHA256="$(sha256sum .release/fresh-backup-receipt.json | cut -d' ' -f1)"
          export PREVIEW_SHA256="$(sha256sum .release-input/preview-proofs.json | cut -d' ' -f1)"
          export GOVERNANCE_SHA256="$(sha256sum .release-input/governance-snapshot.json | cut -d' ' -f1)"
          node -e '
            const fs = require("fs");
            const sha = process.env.RELEASE_SHA;
            const appReceipt = JSON.parse(fs.readFileSync(".release/app-deploy.json"));
            const landingReceipt = JSON.parse(fs.readFileSync(".release/landing-deploy.json"));
            const appId = appReceipt.deploymentId || appReceipt.after?.deploymentId;
            const landingId = landingReceipt.deploymentId || landingReceipt.after?.deploymentId;
            const appSha = appReceipt.sourceSha || appReceipt.after?.sourceSha || sha;
            const landingSha = landingReceipt.sourceSha || landingReceipt.after?.sourceSha || sha;
            const manifest = {
              deployments: [
                { surface: "app", id: appId, sourceSha: appSha },
                { surface: "landing", id: landingId, sourceSha: landingSha }
              ],
              artifacts: [
                { name: "app", sha256: process.env.APP_SHA256 },
                { name: "landing", sha256: process.env.LANDING_SHA256 }
              ],
              backupReceiptSha256: process.env.BACKUP_SHA256,
              previewProofs: [{ name: "same-sha-preview", subjectSha: sha, sha256: process.env.PREVIEW_SHA256 }],
              probes: { ok: true, workflowRun: process.env.GITHUB_RUN_ID },
              governanceSnapshotSha256: process.env.GOVERNANCE_SHA256
            };
            fs.writeFileSync(".release/attestation-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
      - name: Create and verify production attestation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify/release-attestation.mjs create \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --manifest .release/attestation-manifest.json \
            --output .release/production-attestation.json
          node scripts/verify/release-attestation.mjs verify \
            --sha "$RELEASE_SHA" \
            --file .release/production-attestation.json
          sha256sum .release/production-attestation.json > .release/SHA256SUMS

      - name: Attest production evidence provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .release/production-attestation.json

      - name: Upload immutable evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: urania-production-${{ inputs.sha }}
          path: |
            .release/production-attestation.json
            .release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Stage, verify, and publish release last
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          cleanup() {
            trap - ERR INT TERM
            local failed=0
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes || failed=1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || failed=1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "CRITICAL: failed to clean draft release/tag $TAG" >&2
              exit 2
            fi
            exit 1
          }
          trap cleanup ERR INT TERM
          git log "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" \
            --pretty='- %s (%h)' > .release/release-notes.md
          gh release create "$TAG" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file .release/release-notes.md \
            .release/production-attestation.json \
            .release/SHA256SUMS
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SHA"
          test "$(gh release view "$TAG" --json assets --jq '[.assets[].name] | index("production-attestation.json") != null')" = "true"
          gh release download "$TAG" --pattern production-attestation.json --dir .release/verify
          node scripts/verify/release-attestation.mjs verify \
            --sha "$RELEASE_SHA" \
            --file .release/verify/production-attestation.json
          gh release edit "$TAG" --draft=false
          trap - ERR INT TERM
